# ═══════════════════════════════════════════════════════════════
#  BLWardrobe - Configuración Principal
#  Plugin de diseñador de skins con Item Displays
# ═══════════════════════════════════════════════════════════════

# ─── CONFIGURACIÓN GENERAL ───
settings:
  # Idioma del plugin (es, en)
  language: es

  # Debug mode
  debug: false

  # Cooldown entre usos del armario (en segundos)
  cooldown: 5

  # Duración de la sesión del armario (en segundos, 0 = ilimitado)
  session-timeout: 300

  # Teletransportar al jugador al centro del armario al entrar
  teleport-to-center: true

  # Bloquear movimiento del jugador mientras está en el armario
  freeze-player: true

  # Ocultar jugador a otros mientras está en el armario
  hide-player: true

  # Radio máximo para salir del armario (bloques)
  exit-radius: 3.0

# ─── CONFIGURACIÓN DEL ARMARIO ───
wardrobe:
  # Tamaño de la zona del armario (radio en bloques)
  radius: 2.0

  # Altura del maniquí (bloques sobre el suelo)
  mannequin-height: 1.5

  # Distancia de la cámara al maniquí
  camera-distance: 3.0

  # Altura de la cámara relativa al maniquí
  camera-height: 1.0

  # Velocidad de rotación del maniquí (grados por tick)
  rotation-speed: 2.0

  # Mostrar partículas alrededor del maniquí
  particles:
    enabled: true
    type: END_ROD
    count: 5

  # Sonidos
  sounds:
    open: BLOCK_CHEST_OPEN
    close: BLOCK_CHEST_CLOSE
    navigate: UI_BUTTON_CLICK
    select: ENTITY_PLAYER_LEVELUP
    error: ENTITY_VILLAGER_NO
    apply: ITEM_ARMOR_EQUIP_LEATHER

# ─── CAPAS DEL MANIQUI ───
# Cada parte del cuerpo se arma superponiendo varios ItemDisplay (capas),
# uno por categoria. NO hay combinacion entre categorias (skin x shirt x ...):
# cada capa es independiente, asi que agregar mas opciones a una categoria
# NO multiplica la cantidad de modelos que hay que generar/texturizar.
#
# El orden de la lista define el orden de renderizado (la primera va al
# fondo, ej. skin; las siguientes se dibujan encima, ej. shirt/face/pants).
#
# Por capa:
#   category    -> categoria del armario que controla esta capa (skin/face/shirt/hair/pants)
#   id          -> plantilla del id del modelo para esa capa. {categoria} se
#                  reemplaza por el id del item seleccionado.
#   parent      -> modelo base (mismo mesh) sobre el que CraftEngine genera esta capa
#   texture-var -> nombre de la variable de textura en el modelo (si se omite, usa "category")
#   texture     -> plantilla de la ruta de textura. ${categoria} se reemplaza
#                  por el id del item seleccionado.
mannequin-layers:
  namespace: blwardrobe
  material: paper
  parts:
    head:
      - category: skin
        id: "skin_head_{skin}"
        parent: "item/mannequin/head_default"
        texture-var: skin
        texture: "item/mannequin/skin/${skin}"
      - category: face
        id: "face_head_{face}"
        parent: "item/mannequin/head_face_default"
        texture-var: face
        texture: "item/mannequin/face/${face}"
      - category: hair
        id: "hair_head_{hair}"
        parent: "item/mannequin/head_hair_default"
        texture-var: hair
        texture: "item/mannequin/hair/${hair}"
    body:
      - category: skin
        id: "skin_body_{skin}"
        parent: "item/mannequin/body_default"
        texture-var: skin
        texture: "item/mannequin/skin/${skin}"
      - category: shirt
        id: "shirt_body_{shirt}"
        parent: "item/mannequin/body_shirt_default"
        texture-var: shirt
        texture: "item/mannequin/shirt/${shirt}"
      - category: hair
        id: "hair_body_{hair}"
        parent: "item/mannequin/body_hair_default"
        texture-var: hair
        texture: "item/mannequin/hair/${hair}"
    leftarm:
      - category: skin
        id: "skin_arm_left_{skin}"
        parent: "item/mannequin/arm_left_default"
        texture-var: skin
        texture: "item/mannequin/skin/${skin}"
      - category: shirt
        id: "shirt_arm_left_{shirt}"
        parent: "item/mannequin/arm_left_shirt_default"
        texture-var: shirt
        texture: "item/mannequin/shirt/${shirt}"
      - category: hair
        id: "hair_arm_left_{hair}"
        parent: "item/mannequin/arm_left_hair_default"
        texture-var: hair
        texture: "item/mannequin/hair/${hair}"
    rightarm:
      - category: skin
        id: "skin_arm_right_{skin}"
        parent: "item/mannequin/arm_right_default"
        texture-var: skin
        texture: "item/mannequin/skin/${skin}"
      - category: shirt
        id: "shirt_arm_right_{shirt}"
        parent: "item/mannequin/arm_right_shirt_default"
        texture-var: shirt
        texture: "item/mannequin/shirt/${shirt}"
      - category: hair
        id: "hair_arm_right_{hair}"
        parent: "item/mannequin/arm_right_hair_default"
        texture-var: hair
        texture: "item/mannequin/hair/${hair}"
    leftleg:
      - category: skin
        id: "skin_leg_left_{skin}"
        parent: "item/mannequin/leg_left_default"
        texture-var: skin
        texture: "item/mannequin/skin/${skin}"
      - category: pants
        id: "pants_leg_left_{pants}"
        parent: "item/mannequin/leg_left_pants_default"
        texture-var: pants
        texture: "item/mannequin/pants/${pants}"
    rightleg:
      - category: skin
        id: "skin_leg_right_{skin}"
        parent: "item/mannequin/leg_right_default"
        texture-var: skin
        texture: "item/mannequin/skin/${skin}"
      - category: pants
        id: "pants_leg_right_{pants}"
        parent: "item/mannequin/leg_right_pants_default"
        texture-var: pants
        texture: "item/mannequin/pants/${pants}"

skin-services:
  # Servicio principal: MINESKIN | SKINSRESTORER | DIRECT
  # MINESKIN: Usa la API de MineSkin para generar skins firmadas
  # SKINSRESTORER: Usa el plugin SkinsRestorer instalado
  # DIRECT: Intenta aplicar directamente (solo funciona en offline mode con mods)
  primary-service: MINESKIN

  # ─── MineSkin API ───
  mineskin:
    # Tu API Key de MineSkin (obtén una en account.mineskin.org)
    # Dejar vacío para usar el plan gratuito (con límites)
    api-key: ""

    # Visibilidad de las skins generadas: PUBLIC | PRIVATE
    visibility: PUBLIC

    # Tiempo de espera máximo para generar una skin (segundos)
    timeout: 30

    # Reintentos si falla la generación
    retries: 3

    # Modelo por defecto: classic | slim
    default-variant: classic

  # ─── SkinsRestorer ───
  skinsrestorer:
    # Habilitar integración con SkinsRestorer
    enabled: true

    # Comando para aplicar la skin (placeholders: %player%, %url%)
    apply-command: "skin url \"%url%\" %player%"

  # ─── Imgur Upload (para hosting de imágenes) ───
  imgur:
    # Client ID de Imgur (obtén uno en api.imgur.com)
    client-id: ""

    # Habilitar subida automática a Imgur
    enabled: false

    # Álbum donde subir las skins (opcional)
    album: ""

# ─── CONFIGURACIÓN DEL RESOURCE PACK ───
resourcepack:
  # URL del resource pack (debe ser HTTPS y accesible públicamente)
  # Deja en blanco para no enviar resource pack (asume que ya lo tienen)
  url: ""

  # SHA1 del resource pack (opcional pero recomendado)
  sha1: ""

  # Mensaje mostrado al jugador
  prompt: "&a¡Descarga nuestro resource pack para ver las skins personalizadas!"

  # Forzar descarga (kickea si no acepta)
  required: true

  # Auto-generar resource pack desde el plugin
  auto-generate: true

  # Puerto para hostear el resource pack internamente (0 = desactivado)
  internal-port: 0

# ─── CONFIGURACIÓN DE MENSAJES ───
messages:
  prefix: "&8[&6BLWardrobe&8] &r"

  open-wardrobe: "&a¡Abriendo tu armario!"
  close-wardrobe: "&cCerrando armario..."
  no-permission: "&cNo tienes permiso para usar esta prenda."
  no-permission-command: "&cNo tienes permiso para usar este comando."
  skin-applied: "&a¡Skin aplicada correctamente!"
  skin-saved: "&a¡Tu diseño ha sido guardado!"
  skin-error: "&cError al aplicar la skin. Intenta de nuevo."
  category-changed: "&eCategoría: &f%category%"
  item-selected: "&eSeleccionado: &f%item%"
  cooldown: "&cDebes esperar &f%time% &csegundos para usar el armario."
  wardrobe-full: "&cEl armario está ocupado. Espera tu turno."
  resource-pack-required: "&cNecesitas aceptar el resource pack para usar el armario."

  # Mensajes del menú
  menu-title: "&8&lARMARIO DE SKINS"
  menu-category: "&eCategoría: &f%category%"
  menu-item: "&f%item%"
  menu-locked: "&c&lBLOQUEADO"
  menu-selected: "&a&l✓ SELECCIONADO"

  # Controles
  controls-title: "&7&lControles:"
  controls-wasd: "&7WASD &f- Navegar"
  controls-space: "&7ESPACIO &f- Seleccionar"
  controls-shift: "&7SHIFT &f- Atrás/Cerrar"
  controls-q: "&7Q &f- Rotar maniquí"
  controls-e: "&7E &f- Cambiar categoría"

# ─── CONFIGURACIÓN DE ALMACENAMIENTO ───
storage:
  # Tipo: YAML | MYSQL
  type: YAML

  mysql:
    host: localhost
    port: 3306
    database: blwardrobe
    username: root
    password: ""
    table-prefix: blw_

  # Guardar diseños de skins por jugador
  save-designs: true

  # Máximo de diseños guardados por jugador
  max-saved-designs: 10

# ─── CONFIGURACIÓN DE LOCACIONES ───
# Puedes definir múltiples armarios en el mundo

wardrobes:
  spawn:
    world: world
    mannequin:
      x: 0.0
      y: 64.0 # real 63, config 64, debes añadir +1
      z: 0.0
      orientation: SOUTH
    camera:
      x: 0.0
      y: 64.0
      z: 2.0
      yaw: 180.0
      pitch: 10.0
    auto-rotate: false
    enabled: true

  # Ejemplo de otro armario:
  # shop:
  #   world: world
  #   mannequin:
  #     x: 100.0
  #     y: 70.0
  #     z: 200.0
  #     orientation: EAST
  #   camera:
  #     x: 97.0
  #     y: 71.0
  #     z: 200.0
  #     yaw: 90.0
  #     pitch: 0.0
  #   auto-rotate: false
  #   enabled: true

# ─── CONFIGURACIÓN DE PRECIOS (si usas economía) ───
prices:
  # Habilitar sistema de precios
  enabled: false

  # Moneda: VAULT | ITEM | POINTS
  currency: VAULT

  # Precio base por cambio de prenda
  base-price: 0

  # Precios por categoría (sobrescriben el base)
  category-prices:
    skin-tone: 0
    face: 100
    shirt: 150
    pants: 150
    shoes: 100
    accessories: 200

# ─── CONFIGURACIÓN DE ACTUALIZACIÓN AUTOMÁTICA ───
update-checker:
  enabled: true
  notify-admins: true